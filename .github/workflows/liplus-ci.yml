name: Liplus Governance CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issues:
    types: [opened, edited]

jobs:
  governance:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        if: github.event_name != 'issues'
        uses: actions/checkout@v4

      - name: Validate Commit Message
        if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge ')"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE=$(echo "$COMMIT_MESSAGE" | head -n1)
          BODY=$(echo "$COMMIT_MESSAGE" | tail -n +2)

          # ASCII title
          if echo "$TITLE" | grep -P '[^\x00-\x7F]' ; then
            echo "Commit title must be ASCII."
            exit 1
          fi

          # Japanese body
          if ! echo "$BODY" | grep -P '[ぁ-んァ-ン一-龥]' ; then
            echo "Commit body must contain Japanese. Governance is stated in rules/operations/operations.md (Operations Rules)."
            exit 1
          fi

          # Issue reference
          if ! echo "$BODY" | grep -E '#[0-9]+' ; then
            echo "Commit body must contain issue number."
            exit 1
          fi


      - name: Validate Pull Request
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # ASCII title
          if echo "$PR_TITLE" | grep -P '[^\x00-\x7F]' ; then
            echo "PR title must be ASCII."
            exit 1
          fi

          # Japanese body
          if ! echo "$PR_BODY" | grep -P '[ぁ-んァ-ン一-龥]' ; then
            echo "PR body must contain Japanese. Governance is stated in rules/operations/operations.md (Operations Rules)."
            exit 1
          fi

          # Issue reference
          if ! echo "$PR_BODY" | grep -E '#[0-9]+' ; then
            echo "PR body must reference issue number."
            exit 1
          fi

      # Report only; never fails. Behavior tests that set a locale degrade where
      # the locale is missing or does not change the outcome (en_US: the ordering
      # test becomes redundant; tr_TR: the case-folding test skips), and a
      # passing run does not say which mode ran.
      - name: Report locales used by behavior tests
        if: github.event_name != 'issues'
        continue-on-error: true
        run: |
          set +e
          available=$(locale -a 2>/dev/null | tr 'A-Z' 'a-z' | tr -d '.-')
          for name in en_US.UTF-8 tr_TR.UTF-8; do
            key=$(echo "$name" | tr 'A-Z' 'a-z' | tr -d '.-')
            if echo "$available" | grep -qx "$key"; then
              echo "locale $name: available"
            else
              echo "locale $name: missing"
            fi
          done
          c_order=$(printf 'B\na\nc\n' | LC_ALL=C sort | tr '\n' ' ')
          en_order=$(printf 'B\na\nc\n' | LC_ALL=en_US.UTF-8 sort 2>/dev/null | tr '\n' ' ')
          if [ -z "$en_order" ]; then
            echo "ordering test (en_US.UTF-8): sort under en_US.UTF-8 produced no output, mode unknown"
          elif [ "$c_order" != "$en_order" ]; then
            echo "ordering test (en_US.UTF-8): exercised, ambient collation reorders the fixture (C: $c_order/ en_US: $en_order)"
          else
            echo "ordering test (en_US.UTF-8): redundant, ambient collation orders the fixture as C does (order: $c_order)"
          fi
          folded=$(LC_ALL=tr_TR.UTF-8 LC_CTYPE=tr_TR.UTF-8 LANG=tr_TR.UTF-8 awk 'BEGIN { printf "%s", tolower("I") }' 2>/dev/null)
          case "$folded" in
            ""|I|i) echo "case-folding test (tr_TR.UTF-8): will skip, awk tolower(\"I\") = '$folded'" ;;
            *) echo "case-folding test (tr_TR.UTF-8): exercised, awk tolower(\"I\") = '$folded'" ;;
          esac
          exit 0

      - name: Run unit tests
        if: github.event_name != 'issues'
        run: python3 -m unittest discover -s tests

      - name: Validate Issue
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # ASCII title
          if echo "$ISSUE_TITLE" | grep -P '[^\x00-\x7F]' ; then
            echo "Issue title must be ASCII."
            exit 1
          fi

          # Japanese body
          if ! echo "$ISSUE_BODY" | grep -P '[ぁ-んァ-ン一-龥]' ; then
            echo "Issue body must contain Japanese. Governance is stated in rules/operations/operations.md (Operations Rules)."
            exit 1
          fi


